[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sxsvn-insight-engine"
version = "0.1.0"
description = "Evidence-first news classification and company impact analysis"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.3",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.scripts]
sxsvn-news-worker = "ai_engine.worker_cli:main"

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "redis>=5.0"]

[tool.setuptools.packages.find]
include = ["ai_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
